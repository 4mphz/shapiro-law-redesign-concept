<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Layout polish: before and after</title><style>body{font:16px/1.6 system-ui;background:#eef1f3;color:#142a3c;margin:0;padding:32px}main{max-width:1200px;margin:auto}section{margin:48px 0}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}img{width:100%;height:auto}h1,h2{line-height:1.2}a{color:#00699c}@media(max-width:600px){body{padding:16px}.comparison{gap:10px}}</style><main><h1>Layout polish: before and after</h1><p>September 27, 2026. Copy and courthouse background preserved. New 3D book, clearer mobile hero, improved paragraph spacing and interior layouts.</p><p><a href="README.md">Change notes and image-generation prompt</a> · <a href="after-checks.json">Responsive checks</a></p><div id="comparisons"></div><script>for(const [title,name,width,ext] of [['Mobile hero','hero',390,'png'],['Desktop hero','hero',1440,'png'],['Book section','book',390,'png'],['Firm section','firm',1440,'png'],['Contact page','contact',390,'jpg'],['Practice areas','practice-areas',390,'jpg']]){const section=document.createElement('section');section.innerHTML=`<h2>${title}</h2><div class="comparison">${['before','after'].map(stage=>`<div><h3>${stage==='before'?'Before':'After'}</h3><a href="screenshots/${name}-${width}-${stage}.${ext}"><img loading="lazy" alt="${title}, ${stage}" src="screenshots/${name}-${width}-${stage}.${ext}"></a></div>`).join('')}</div>`;document.querySelector('#comparisons').append(section)}</script></main></html>
